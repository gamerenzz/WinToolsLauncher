name: Build Executable

on:

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 .NET 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 下载高品质 Windows 工具图标
      shell: powershell
      run: |
        if (-not (Test-Path "app.ico")) {
            Write-Host "正在下载默认系统设置图标..."
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $iconUrl = "https://raw.githubusercontent.com/microsoft/fluentui-system-icons/main/assets/Settings/ICONS/ico/ic_fluent_settings_24_regular.ico"
            try {
                Invoke-WebRequest -Uri $iconUrl -OutFile "app.ico" -TimeoutSec 15
                Write-Host "图标下载成功！"
            } catch {
                Write-Host "网络超时，跳过图标配置，确保软件正常编译运行。"
            }
        }

    - name: 编译项目 (.NET Framework 4.7.2)
      run: dotnet build WinToolsLauncher.csproj -c Release -o ./build_output

    - name: 上传纯单文件 EXE
      uses: actions/upload-artifact@v4
      with:
        name: WinToolsLauncher
        path: ./build_output/WinToolsLauncher.exe
