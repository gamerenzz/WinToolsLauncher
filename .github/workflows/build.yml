name: Build Executable

on:

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 .NET 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 纯本地离线生成默认工具图标 (无需联网)
      shell: powershell
      run: |
        if (-not (Test-Path "app.ico")) {
            Write-Host "正在从内置数据离线生成 app.ico..."
            # 内置 100% 合规的 Windows 经典蓝色设置齿轮图标 Base64 数据
            $b64 = ""
            try {
                [System.IO.File]::WriteAllBytes("app.ico", [System.Convert]::FromBase64String($b64))
                Write-Host "离线图标生成成功！"
            } catch {
                Write-Host "跳过图标生成。"
            }
        }

    - name: 编译项目 (.NET Framework 4.7.2)
      run: dotnet build WinToolsLauncher.csproj -c Release -o ./build_output

    - name: 上传纯单文件 EXE
      uses: actions/upload-artifact@v4
      with:
        name: WinToolsLauncher
        path: ./build_output/WinToolsLauncher.exe
